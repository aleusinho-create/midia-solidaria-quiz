<section id="result" class="screen">
  <div class="result-card">
    <div class="result-hero">
      <div class="gauge-wrap">
        <svg viewBox="0 0 200 200">
          <circle class="gauge-bg" .../>
          <circle class="gauge-fill" .../>
        </svg>
        <div class="gauge-label">
          <span class="gauge-score">0</span>
          <span class="gauge-max">/ 48</span>
        </div>
      </div>
      <div class="result-headline">
        <span class="level-badge">Nível 3</span>
        <h2>Rede em Ação</h2>
        <p class="tagline">Participante Ativo</p>
      </div>
    </div>
    <p class="description">...</p>
    
    <div class="strengths">
      <h3>Suas forças</h3>
      <div class="strength-chips">
        <span class="chip">...</span>
      </div>
    </div>
    
    <div class="next-steps">
      <h3>Seu próximo passo</h3>
      <ul>...</ul>
    </div>
    
    <div class="email-capture">
      <h3>Receba seu Mapa Solidário</h3>
      <form>
        <input type="email" ...>
        <button>Quero meu mapa</button>
      </form>
    </div>
    
    <div class="ctas">
      <a class="btn-primary">Assinar o Blog</a>
      <a class="btn-secondary">Campanha Mídia Solidária</a>
      <a class="btn-tertiary">Falar com a Mídia Sol</a>
    </div>
    
    <div class="share">
      <p>Compartilhe seu resultado</p>
      <button>WhatsApp</button>
      <button>LinkedIn</button>
      <button>Copiar link</button>
    </div>
    
    <button class="restart">Refazer o quiz</button>
  </div>
</section>
